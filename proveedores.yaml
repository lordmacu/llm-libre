# Registro de proveedores. Tres patrones distintos, los tres declarativos:
#   - Kilo: ids Y capacidades DESCUBIERTOS desde modelos_path (mismo patron
#     que usaba openrouter, sacado de este archivo -- ver la nota junto a
#     minimax, mas abajo -- pero documentado igual en docs/providers.md
#     como ejemplo de este patron con clave opcional).
#   - MiniMax: ids Y capacidades DECLARADOS a mano (modelos_fijos) -- su
#     /models real no trae metadatos de capacidad.
#   - chatgpt: ids DESCUBIERTOS desde modelos_path, capacidades DECLARADAS
#     una sola vez para todos (capacidades_por_defecto) -- su /models SI es
#     dinamico (con cache y TTL), pero solo trae
#     id/object/created/owned_by/description, nunca pricing ni modalidades.
#     Es un mecanismo general: cualquier proveedor futuro con un catalogo
#     igual de desnudo lo puede usar sin tocar codigo.
#
# `prioridad` es un concepto DISTINTO de `tier`: ordena a mano quien se prueba
# primero (nunca mezclar los dos). Default 100 si no se declara. NO rompe el
# invariante de que las rutas de pago van siempre al final: eso lo decide
# `tier`, no `prioridad` (ver router.ordenar).
proveedores:
  - id: chatgpt
    tier: gratis          # no cuesta plata: NO consume el tope de pago
    prioridad: 0           # antes que todo lo demas
    dialecto: openai
    base_url_env: CHATGPT_PROXY_URL   # la URL real se define en el entorno;
    base_url: http://127.0.0.1:8888/v1   # default si la variable no esta.
    # OJO con el /v1: las rutas reales del proxy son /v1/chat/completions y
    # /v1/models (no /chat/completions a secas, como Kilo/OpenRouter) -- sin
    # el /v1 en base_url, cliente.armar_peticion arma una URL de chat
    # invalida. Mismo patron que minimax (base_url: .../v1).
    modelos_path: /models
    # Task 14: ningun proveedor declaraba timeout_s, asi que un chatgpt-proxy
    # colgado costaba hasta TIMEOUT_S=90s completo POR INTENTO -- y chatgpt
    # tiene prioridad:0, asi que es la PRIMERA ruta que prueba CADA pedido
    # (incluida cada vuelta de un failover), corriendo ademas en `blog`, una
    # maquina saturada donde "colgado, no rechazado" es el modo de falla
    # realista (ver §4/§7 del spec). Medido en vivo (2026-08-16, una docena de
    # muestras): tipico ~3.5s, un unico outlier en 28s -- nada cerca de 90s.
    # 45s da ~13x de margen sobre lo tipico y ~1.6x sobre el peor outlier
    # visto (generoso para una muestra chica de solo 12 pedidos, que
    # facilmente subestima la cola real), y a la vez CORTA A LA MITAD el
    # peor caso de un cuelgue real frente al default global de 90s -- eso
    # importa porque un fallo no-429 aca solo suma SOSPECHA (UMBRAL_SOSPECHA
    # 3 seguidos, ver proxy.py), asi que ni siquiera un timeout ocasional por
    # ser demasiado ajustado saca a chatgpt de rotacion: la sonda de
    # confirmacion que dispara la sospecha es un PING corto que normalmente
    # responde en el rango tipico, no en el peor caso de una generacion
    # completa. No se toca el timeout de ningun otro proveedor.
    timeout_s: 45
    desenvuelve_canvas: true   # ver el hallazgo 1 de la revision en catalogo.py/razonamiento.py:
                                # es el UNICO proveedor que de verdad filtra el modo canvas al
                                # content -- ':::nota{...}' tambien es sintaxis Docusaurus/MDX
                                # legitima, y aplicarla a ciegas le arranca las marcas a Kilo/
                                # OpenRouter (verificado en vivo).
    # emula_tools: inject_into_body convierte `tools` en instrucciones de texto
    # antes de mandar al proxy; el proxy nunca ve el campo `tools`. La advertencia
    # anterior ("tools:false OBLIGATORIO") ya no aplica: la barrera esta en la capa
    # de emulacion, no en declarar la capacidad como false.
    emula_tools: true
    capacidades_por_defecto:
      # Su /v1/models SI es dinamico pero NUNCA trae metadatos de capacidad;
      # capacidades se declaran aca y catalogo.normalizar las aplica a cada id.
      # tools:false en el catalogo — emula_tools:true lo eleva a true via la capa
      # de emulacion (ver tool_emulator.py y catalogo.normalizar).
      tools: false
      vision: false
      contexto: 128000
      max_salida: 8192
    # Los alias legacy (gpt-4o, gpt-4o-mini, gpt-4, gpt-3.5-turbo) y el id
    # "auto" que el propio /v1/models expone NO se filtran aca: se
    # autoidentifican (description empieza con "Alias →") o son un id
    # reservado del gateway (colisiona con el alias "auto" de
    # interpretar_pedido), y catalogo.normalizar los descarta en tiempo de
    # descubrimiento -- ver IDS_RESERVADOS y _es_alias en catalogo.py.

  - id: perplexity
    tier: gratis
    # Misma prioridad que kilo A PROPOSITO: no hay evidencia de que sea mejor ni
    # peor, asi que decide el ranking medido, que es para lo que existe. La
    # prioridad es preferencia manual, no una corazonada.
    prioridad: 1
    dialecto: openai
    base_url_env: PERPLEXITY_PROXY_URL
    base_url: http://127.0.0.1:8891/v1   # default; el /v1 es obligatorio (ver chatgpt)
    # Su /v1/models publica 124 modelos (gpt5, claude46sonnet, grok4, gemini31pro...)
    # pero en el flujo ANONIMO todos caen a `turbo`: verificado el 2026-08-17
    # pidiendo cuatro de ellos y recibiendo `model: turbo` en los cuatro, con el
    # propio modelo respondiendo "Perplexity". Declarar las 124 seria mentirle al
    # ranking: mediria 124 nombres que son el mismo modelo y gastaria 124 veces la
    # cuota de sondeo. Por eso va UNA ruta declarada, no catalogo descubierto.
    # emula_tools: tool calling via prompt injection, mismo mecanismo que deepseek.
    emula_tools: true
    modelos_fijos:
      # tools:false nativo verificado; emula_tools:true lo eleva via la capa de emulacion.
      # vision:false: no soporta imagenes de entrada.
      # contexto: piso conservador, el proxy ignora max_tokens de todas formas.
      - id: turbo
        tools: false
        vision: false
        contexto: 32000
        max_salida: 4096
    # Latencia medida (2026-08-17): 1.85-2.47s, mas rapido que chatgpt-proxy
    # (3.5-4.4s). Aun asi 45s de techo, como chatgpt: acota un cuelgue sin
    # cortar una generacion larga legitima.
    timeout_s: 45

  - id: deepseek
    tier: gratis
    # Misma prioridad que kilo y perplexity: que decida el ranking medido.
    prioridad: 1
    dialecto: openai
    base_url_env: DEEPSEEK_PROXY_URL
    base_url: http://127.0.0.1:8892/v1
    # Modelos declarados: su /v1/models es una lista fija de tres, sin metadatos.
    # A diferencia de perplexity, aca los modelos SI difieren de verdad --
    # verificado el 2026-08-17: deepseek-chat acerto la trampa del bate y la
    # pelota (0.05) y el reasoner razona antes de responder.
    modelos_fijos:
      # tools:false verificado: manda las tools sin reventar pero nunca devuelve
      # tool_calls, contesta en prosa -- mas peligroso que un 500, porque un
      # cliente agentico recibiria texto donde espera una llamada estructurada.
      - id: deepseek-chat
        tools: false
        vision: false
        contexto: 64000
        max_salida: 8192
      - id: deepseek-reasoner
        tools: false
        vision: false
        contexto: 64000
        max_salida: 8192
    # NO se declara deepseek-vision: no se verifico entrada de imagenes, y
    # declarar una capacidad sin comprobarla es como enrutar a ciegas.
    # Latencia medida: 4.2-4.5s. 60s de techo: el proof-of-work en WASM suma
    # tiempo variable antes de que DeepSeek siquiera empiece a responder.
    timeout_s: 60
    # Experimento de emulacion de tool calling via prompt injection.
    # armar_peticion convierte `tools` en instrucciones de texto en el system
    # prompt; proxy.py detecta si la respuesta es un JSON de tool call y lo
    # convierte al formato OpenAI. Ver emulador_tools.py y test_emulador_tools.py.
    emula_tools: true

  - id: grok
    tier: gratis          # el proxy corre sobre el tier gratuito de Grok
    prioridad: 1
    dialecto: openai
    base_url_env: GROK_PROXY_URL
    base_url: http://127.0.0.1:8893/v1
    clave_env: GROK_API_KEY   # el proxy exige Authorization: Bearer <API_KEY>
    modelos_path: /models
    # Mismo patron que chatgpt: los ids se DESCUBREN de /models (33 el
    # 2026-08-18, con un pool de alta tasa por detras), pero ese catalogo solo
    # trae id/object/created/owned_by/notes -- ni capacidades ni contexto --
    # asi que las capacidades se declaran una vez para todos.
    #
    # OJO: /models expone un id "auto" propio de Grok que COLISIONA con el
    # alias "auto" de llm-libre. No hace falta hacer nada: catalogo.es_id_reservado
    # ya lo descarta, que es exactamente para lo que existe.
    capacidades_por_defecto:
      # tools Y vision en TRUE, y el camino hasta este valor merece quedar
      # escrito porque casi nos cuesta 30 rutas utiles.
      #
      # Grok NO es un catalogo de 31 modelos: es un POOL con alias. En
      # grok_backend.resolve_model, un id que no esta en MODELS_CATALOG cae en
      # `_rotator.next()` -- round-robin. O sea que "gpt-4o" o "claude-3-opus"
      # no identifican un backend: cada llamada aterriza en uno distinto. Por
      # eso medir UNA vez por id da resultados contradictorios (grok-420 dio
      # tools=SI en un barrido y 0/3 al repetirlo tres veces): no se estaba
      # midiendo un modelo sino la ruleta.
      #
      # vision: el proxy resuelve esto SOLO. resolve_vision_model() detecta la
      # imagen y, si el backend pedido no ve, la manda al VISION_POOL. Medido:
      # 30 de 31 rutas leyeron un codigo de 4 digitos de una imagen de
      # 488x232. Las que no, abajo.
      tools: true
      vision: true
      contexto: 128000
      max_salida: 8192
    # La familia imagine-agent-mode es lo unico realmente distinto: son
    # agentes de generacion de imagenes, no de chat. 0/3 en tool_calls al
    # repetir, y el propio grok_backend lo dice: "imagine-agent-mode* NO
    # tienen vision via f6". Medicion y codigo coinciden, que es la unica
    # razon por la que esta excepcion se declara y las otras cinco que
    # sospeche NO: claude-3-opus, gpt-4o y grok-4-1-thinking-1129 dieron 3/3
    # al repetir, su "no" original era la ruleta.
    excepciones:
      imagine-agent-mode:          {tools: false, vision: false}
      imagine-agent-mode-dev:      {tools: false, vision: false}
      imagine-agent-mode-grok-4-5: {tools: false, vision: false}

  - id: kilo
    tier: gratis
    prioridad: 1
    dialecto: openai
    base_url: https://api.kilo.ai/api/gateway
    clave_env: KILO_API_KEY          # OPCIONAL: sin clave el tier anonimo funciona igual
    modelos_path: /models

  # openrouter (patron "todo descubierto", igual que kilo -- ver la nota de
  # cabecera) SACADO del registro en produccion: nunca se definio
  # OPENROUTER_API_KEY, asi que sus 16 rutas devolvian 401 en TODO pedido, el
  # sondeo lo confirmaba, y el router las mandaba a cooldown correctamente --
  # pero eran casi la mitad del catalogo (16 de ~34 rutas), gastando cupo de
  # sonda y espacio en /v1/ranking solo para demostrar, una y otra vez, que
  # seguian muertas (medido en vivo: 21 rutas en cooldown, 16 de openrouter).
  # Decision del operador: sacarlo en vez de conseguir la clave. Las rutas ya
  # sincronizadas de "openrouter" NO quedan huerfanas -- ver
  # Almacen.desactivar_proveedores_no_registrados, que sondeo.sincronizar_catalogo
  # llama en cada ciclo con el conjunto de ids que el PROCESO tiene cargado
  # de este archivo: un proveedor que ya no esta aca se apaga (activa=0,
  # nunca se borra) solo, sin tocar codigo. OJO (revision de gate): esta
  # lista se carga UNA vez, al arrancar (`proveedores.cargar()` en
  # `principal.crear_estado`) -- un edit a este archivo recien surte efecto
  # despues de reiniciar el proceso; el barrido en si, una vez cargada la
  # lista nueva, ya no necesita ninguna intervencion manual mas alla de ese
  # reinicio. El patron sigue documentado en docs/providers.md como ejemplo
  # de registro "todo descubierto" con clave opcional -- volver a agregarlo
  # es una entrada de YAML, no un cambio de
  # codigo.

  - id: minimax
    tier: pago
    prioridad: 2
    dialecto: openai
    base_url: https://api.minimax.io/v1
    clave_env: MINIMAX_API_KEY
    modelos_fijos:
      # Verificado 2026-08-16 contra la API real: chat, tools y streaming OK.
      # contexto es un PISO conservador usado solo para filtrar por x_min_contexto;
      # subirlo si se confirma uno mayor.
      - id: MiniMax-M3
        tools: true
        # vision paso de false a TRUE el 2026-08-18: estaba en false solo
        # porque nadie lo habia probado, y el barrido mostro que nombra el
        # rojo correctamente. Era una capacidad que teniamos y no usabamos:
        # con vision:false, un pedido con imagen ni siquiera la consideraba.
        vision: true
        contexto: 128000
        max_salida: 32768
