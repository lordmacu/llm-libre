# Provider registry. Three distinct patterns, all three declarative:
#   - Kilo: ids AND capabilities DISCOVERED from models_path (the same pattern
#     openrouter used, now removed from this file -- see the note next to
#     minimax, below -- but still documented in docs/providers.md as the
#     example of this pattern with an optional key).
#   - MiniMax: ids AND capabilities DECLARED by hand (fixed_models) -- its real
#     /models carries no capability metadata.
#   - chatgpt: ids DISCOVERED from models_path, capabilities DECLARED once for
#     all of them (default_capabilities) -- its /models IS dynamic (with a cache
#     and a TTL), but only brings id/object/created/owned_by/description, never
#     pricing or modalities. It is a general mechanism: any future provider with
#     an equally bare catalogue can use it without touching code.
#
# `priority` is a concept DISTINCT from `tier`: it manually orders who gets
# tried first (never mix the two). Default 100 when not declared. It does NOT
# break the invariant that paid routes always go last: that is decided by
# `tier`, not by `priority` (see router.order_routes).
providers:
  - id: chatgpt
    tier: free          # costs no money: does NOT consume the paid cap
    priority: 0           # before everything else
    dialect: openai
    base_url_env: CHATGPT_PROXY_URL   # the real URL is set in the environment;
    base_url: http://127.0.0.1:8888/v1   # default when the variable is absent.
    # CAREFUL with the /v1: the proxy's real paths are /v1/chat/completions and
    # /v1/models (not a bare /chat/completions, as with Kilo/OpenRouter) --
    # without the /v1 in base_url, client.build_request assembles an invalid
    # chat URL. Same pattern as minimax (base_url: .../v1).
    models_path: /models
    # Task 14: no provider declared timeout_s, so a hung chatgpt-proxy cost the
    # full TIMEOUT_S=90s PER ATTEMPT -- and chatgpt has priority:0, so it is the
    # FIRST route tried on EVERY request (including every round of a failover),
    # running moreover on `blog`, a saturated machine where "hung, not refused"
    # is the realistic failure mode (see §4/§7 of the spec). Measured live
    # (2026-08-16, a dozen samples): typically ~3.5s, one single outlier at 28s
    # -- nowhere near 90s. 45s gives ~13x margin over the typical case and ~1.6x
    # over the worst outlier seen (generous for a small sample of only 12
    # requests, which easily underestimates the real tail), and at the same time
    # HALVES the worst case of a real hang against the global 90s default --
    # that matters because a non-429 failure here only adds SUSPICION
    # (SUSPICION_THRESHOLD 3 in a row, see proxy.py), so not even an occasional
    # timeout from being too tight takes chatgpt out of rotation: the
    # confirmation probe suspicion fires is a short PING that normally answers
    # in the typical range, not in the worst case of a full generation. No other
    # provider's timeout is touched.
    timeout_s: 45
    unwraps_canvas: true   # see finding 1 of the review in catalog.py/reasoning.py:
                                # it is the ONLY provider that genuinely leaks canvas mode into
                                # content -- ':::nota{...}' is also legitimate Docusaurus/MDX
                                # syntax, and applying it blindly tears the markers out of
                                # Kilo/OpenRouter answers (verified live).
    # emulates_tools stays OFF here, and this was MEASURED, not assumed.
    #
    # Turning it on (2026-08-18) was a mistake worth recording so nobody repeats
    # it. The proxy does honour a system message -- asked to reply "BANANA" it
    # replies BANANA -- so the injected instructions do reach the model. It just
    # ignores them: given a weather tool it answered from its own knowledge with
    # web-search citations, and given a tool it demonstrably could NOT answer
    # (a private order database) it returned mangled output and said outright
    # that it cannot access the function. Measured 0/3 tool_calls, twice.
    #
    # The damage was not merely "it does not help". This provider has
    # `priority: 0`, so it is the FIRST route tried for EVERY request: claiming
    # tools=True made it intercept every tool call in the gateway and answer
    # prose to agentic clients that were waiting for a structured call. That is
    # exactly the silent failure that declaring tools:false exists to prevent --
    # a 500 fails honestly and triggers failover, prose does not.
    default_capabilities:
      # Its /v1/models IS dynamic but never carries capability metadata, so
      # capabilities are declared once here and catalog.normalize applies them
      # to every discovered id.
      #
      # tools:false is MANDATORY -- re-confirmed 2026-08-18. The proxy no longer
      # returns HTTP 500 when handed tools, but it still has no function calling:
      # with tool_choice:"required" it returns tool_calls:None and plain prose.
      # Its own docs draw the same distinction -- "advanced tools: bookings,
      # shopping, widgets, canvas" (supported) vs "function calling / tool_calls
      # in the response: not supported on the anonymous backend" (not) -- and
      # llm-libre's `tools` capability means the second one. This declaration is
      # the only barrier keeping tool-calling traffic away from this provider.
      tools: false
      vision: false
      context: 128000
      max_output: 8192
    # The legacy aliases (gpt-4o, gpt-4o-mini, gpt-4, gpt-3.5-turbo) and the
    # "auto" id its own /v1/models exposes are NOT filtered here: they identify
    # themselves (description starts with "Alias →") or they are a gateway
    # reserved id (colliding with parse_request's "auto" alias), and
    # catalog.normalize discards them at discovery time -- see RESERVED_IDS and
    # _is_alias in catalog.py.

  - id: perplexity
    tier: free
    # The same priority as kilo ON PURPOSE: there is no evidence it is better or
    # worse, so the measured ranking decides, which is what it exists for.
    # Priority is manual preference, not a hunch.
    priority: 1
    dialect: openai
    base_url_env: PERPLEXITY_PROXY_URL
    base_url: http://127.0.0.1:8891/v1   # default; the /v1 is mandatory (see chatgpt)
    # Its /v1/models publishes 124 models (gpt5, claude46sonnet, grok4,
    # gemini31pro...) but in the ANONYMOUS flow they all land on `turbo`:
    # verified on 2026-08-17 by asking for four of them and receiving
    # `model: turbo` on all four, with the model itself answering "Perplexity".
    # Declaring all 124 would be lying to the ranking: it would measure 124
    # names that are the same model and spend 124x the probe quota. That is why
    # ONE declared route goes here, not a discovered catalogue.
    # emulates_tools stays OFF: measured 0/3 tool_calls through the emulation
    # layer on 2026-08-18, same as chatgpt (see the long note there for why
    # claiming a capability this provider does not have is worse than admitting
    # it lacks one). Only deepseek passed that test.
    fixed_models:
      # tools:false verified natively AND through emulation -- neither works.
      # vision:false: it does not support image input.
      # context: a conservative floor, the proxy ignores max_tokens anyway.
      - id: turbo
        tools: false
        vision: false
        context: 32000
        max_output: 4096
    # Measured latency (2026-08-17): 1.85-2.47s, faster than chatgpt-proxy
    # (3.5-4.4s). Still a 45s ceiling, like chatgpt: it bounds a hang without
    # cutting a legitimately long generation short.
    timeout_s: 45

  - id: deepseek
    tier: free
    # The same priority as kilo and perplexity: let the measured ranking decide.
    priority: 1
    dialect: openai
    base_url_env: DEEPSEEK_PROXY_URL
    base_url: http://127.0.0.1:8892/v1
    # Declared models: its /v1/models is a fixed list of three, with no
    # metadata. Unlike perplexity, here the models DO genuinely differ --
    # verified on 2026-08-17: deepseek-chat got the bat-and-ball trap right
    # (0.05) and the reasoner reasons before answering.
    fixed_models:
      # tools:false verified: it accepts tools without blowing up but never
      # returns tool_calls, it answers in prose -- more dangerous than a 500,
      # because an agentic client would receive text where it expects a
      # structured call.
      - id: deepseek-chat
        tools: false
        vision: false
        context: 64000
        max_output: 8192
      - id: deepseek-reasoner
        tools: false
        vision: false
        context: 64000
        max_output: 8192
    # deepseek-vision is NOT declared: image input was never verified, and
    # declaring a capability without checking it is routing blind.
    # Measured latency: 4.2-4.5s. A 60s ceiling: the WASM proof-of-work adds
    # variable time before DeepSeek even starts answering.
    timeout_s: 60
    # Tool-calling emulation through prompt injection.
    # client.build_request turns `tools` into text instructions in the system
    # prompt; proxy.py detects whether the answer is a tool-call JSON and
    # converts it to the OpenAI shape. See tool_emulator.py and
    # test_tool_emulator.py.
    emulates_tools: true

  - id: grok
    tier: free          # the proxy runs on Grok's free tier
    priority: 1
    dialect: openai
    base_url_env: GROK_PROXY_URL
    base_url: http://127.0.0.1:8893/v1
    api_key_env: GROK_API_KEY   # the proxy demands Authorization: Bearer <API_KEY>
    models_path: /models
    # Same pattern as chatgpt: the ids are DISCOVERED from /models (33 of them
    # on 2026-08-18, with a high-rate pool behind), but that catalogue only
    # brings id/object/created/owned_by/notes -- neither capabilities nor
    # context -- so capabilities are declared once for all of them.
    #
    # CAREFUL: /models exposes an "auto" id of Grok's own that COLLIDES with
    # llm-libre's "auto" alias. Nothing needs doing: catalog.is_reserved_id
    # already discards it, which is exactly what it exists for.
    default_capabilities:
      # tools AND vision both TRUE, and the path to this value is worth writing
      # down because it nearly cost us 30 usable routes.
      #
      # Grok is NOT a catalogue of 31 models: it is a POOL with aliases. In
      # grok_backend.resolve_model, an id not in MODELS_CATALOG falls through to
      # `_rotator.next()` -- round-robin. So "gpt-4o" or "claude-3-opus" do not
      # identify a backend: every call lands on a different one. That is why
      # measuring ONCE per id gives contradictory results (grok-420 reported
      # tools=YES in one sweep and 0/3 when repeated three times): what was
      # being measured was not a model but the roulette.
      #
      # vision: the proxy solves this ON ITS OWN. resolve_vision_model() detects
      # the image and, if the requested backend cannot see, sends it to the
      # VISION_POOL. Measured: 30 of 31 routes read a 4-digit code from a
      # 488x232 image. The ones that did not are below.
      tools: true
      vision: true
      context: 128000
      max_output: 8192
    # The imagine-agent-mode family is the only genuinely different thing: they
    # are image-generation agents, not chat. 0/3 on tool_calls when repeated,
    # and grok_backend itself says so: "imagine-agent-mode* have NO vision via
    # f6". Measurement and code agree, which is the only reason this exception
    # is declared and the other five I suspected are NOT: claude-3-opus, gpt-4o
    # and grok-4-1-thinking-1129 gave 3/3 when repeated, their original "no" was
    # the roulette.
    exceptions:
      imagine-agent-mode:          {tools: false, vision: false}
      imagine-agent-mode-dev:      {tools: false, vision: false}
      imagine-agent-mode-grok-4-5: {tools: false, vision: false}

  - id: mistral
    tier: free          # a free Le Chat account: no per-request billing
    # The same priority as the other free third parties: no evidence it is
    # better or worse, so the measured ranking decides.
    priority: 1
    dialect: openai
    base_url_env: MISTRAL_PROXY_URL
    base_url: http://127.0.0.1:8894/v1   # default; the /v1 is mandatory (see chatgpt)
    # ONE declared route, not the ten its /v1/models publishes. That endpoint
    # advertises mistral-small-latest, mistral-large-latest, codestral-latest,
    # open-mistral-7b and six more -- and every one of them is the same model.
    # Measured 2026-08-18: asked "exactly which model are you?" through four
    # different ids, all four answered "Mistral Medium 3.5". The proxy echoes
    # the requested `model` back in the response envelope but never forwards it:
    # Le Chat's tRPC newChat body has no model field at all, so the id is
    # decorative. Declaring the ten would be the perplexity mistake again --
    # ten names measured and probed independently, all hitting one backend,
    # spending 10x the probe quota to rank a single model against itself.
    #
    # The declared id is the honest one: mistral-medium-latest is what actually
    # answers, so a client asking for it gets what it asked for.
    fixed_models:
      - id: mistral-medium-latest
        # tools:false MEASURED, not assumed: with tool_choice:"required" and a
        # weather tool it returned tool_calls:None and the prose "I cannot
        # access real-time weather data", 3/3. The proxy's request schema has no
        # `tools` field at all, so nothing was ever going to reach the model.
        tools: false
        # vision:true MEASURED: a 64x64 solid red PNG sent as a data: URI came
        # back named "Red". The proxy uploads images to Mistral's Azure Blob
        # storage and passes them in the files array -- a real path, not a claim.
        vision: true
        # Both are conservative FLOORS, DECLARED not measured: Mistral Medium
        # 3.5's published window is larger, but nothing here verified it, and
        # `context` is only used to filter by x_min_context. Raise it when it is
        # confirmed.
        context: 32000
        max_output: 8192
    # 60s, and the reason is CONCURRENCY, not single-request latency. Alone it
    # answers in 3.5-7.4s (streaming ttft 3.5s). But the proxy holds ONE shared
    # account session, and three concurrent requests measured 4.9s / 12.6s /
    # 16.2s with a 16.2s wall clock -- it serialises rather than parallelising.
    # A 45s ceiling like chatgpt's would be within ~3x of an observed real
    # request under load, which is how a healthy provider gets timed out for
    # being busy rather than broken.
    timeout_s: 60
    # emulates_tools ON, and this is the ONE provider besides deepseek that
    # earned it. Measured 2026-08-18 by running llm-libre's own tool_emulator
    # against the real backend: 6/6 across three cases x two attempts --
    # single tool with tool_choice:"required", two tools where it had to pick
    # the right one (it picked web_search over get_weather and filled both
    # `query` and `limit`), and tool_choice:"auto" where a tool was clearly
    # warranted. Compare chatgpt and perplexity, both 0/3 on the same test and
    # both left OFF: this flag is a claim about a provider, and a claim about a
    # provider gets measured.
    emulates_tools: true

  - id: kilo
    tier: free
    priority: 1
    dialect: openai
    base_url: https://api.kilo.ai/api/gateway
    api_key_env: KILO_API_KEY          # OPTIONAL: the anonymous tier works without a key
    models_path: /models

  # openrouter (the "everything discovered" pattern, same as kilo -- see the
  # header note) REMOVED from the production registry: OPENROUTER_API_KEY was
  # never defined, so its 16 routes returned 401 on EVERY request, probing
  # confirmed it, and the router sent them to cooldown correctly -- but they
  # were almost half the catalogue (16 of ~34 routes), spending probe budget and
  # space in /v1/ranking only to prove, over and over, that they were still dead
  # (measured live: 21 routes in cooldown, 16 of them openrouter). Operator's
  # decision: remove it rather than obtain the key. The already-synced
  # "openrouter" routes are NOT left orphaned -- see
  # Storage.deactivate_unregistered_providers, which probing.sync_catalogue
  # calls on every cycle with the set of ids the PROCESS loaded from this file:
  # a provider no longer here switches itself off (active=0, never deleted),
  # without touching code. CAREFUL (gate review): this list is loaded ONCE, at
  # startup (`providers.load()` in `main.build_state`) -- an edit to this file
  # only takes effect after restarting the process; the sweep itself, once the
  # new list is loaded, needs no further manual intervention beyond that
  # restart. The pattern stays documented in docs/providers.md as the example of
  # an "everything discovered" registration with an optional key -- adding it
  # back is a YAML entry, not a code change.

  - id: minimax
    tier: paid
    priority: 2
    dialect: openai
    base_url: https://api.minimax.io/v1
    api_key_env: MINIMAX_API_KEY
    fixed_models:
      # Verified 2026-08-16 against the real API: chat, tools and streaming OK.
      # context is a conservative FLOOR used only to filter by x_min_context;
      # raise it if a larger one is confirmed.
      - id: MiniMax-M3
        tools: true
        # vision went from false to TRUE on 2026-08-18: it was false only
        # because nobody had tried it, and the sweep showed it names red
        # correctly. It was a capability we had and were not using: with
        # vision:false, a request carrying an image did not even consider it.
        vision: true
        context: 128000
        max_output: 32768
